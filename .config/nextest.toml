nextest-version = { required = "0.9.137" }

[profile.default]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci]
fail-fast = false

# These process oracles compile/use actual SDK clock producers and enforce the
# production 500ms query deadline. Bound unrelated compiler contention instead
# of relaxing the clock/retention supervisor or retrying a denied managed call.
[test-groups.native-clock]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary(table_service) | binary(native_clock) | binary(agent_service)'
test-group = 'native-clock'
